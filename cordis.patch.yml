                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    # Profile-owned provider: same first-prompt contract with persistent route settings.
    - id: session-title-llm-tui
      name: 'dsh-omp-tui/session-title'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: tui-prompt
      name: 'dsh-omp-tui/prompt'

    - id: tui-startup
      name: 'dsh-omp-tui/startup'

    # WeChat (iLink) bridge: remote control via the official Tencent WeChat
    # channel. Loads before the TUI so the TUI's user-questions provider can
    # delegate ask questions to WeChat through ctx.wechat.askWithFallback.
    - id: wechat-ilink
      name: 'dsh-omp-tui/wechat'

    # Community std adapter: when `@dsh-std/adapter-dsh` is installed it
    # inserts its own `dsh-std-adapter` row (discover:true) and mounts profile
    # components after our host rows. Do not insert a duplicate row here.
    # `dsh-omp-tui/std-adapter` / `std-profile-loader` subpaths remain exported
    # for profiles that compose the adapter manually.
    #
    # On dsh 0.2 the adapter row cannot activate in a terminal profile: its row
    # injects `sessionController`, which `@deepseek-ai/dsh-api-session-controller`
    # provides only alongside `fileUploads` (needs `connection`) and
    # `workspaceRegistry` — the web client stack. Installing it therefore leaves a
    # permanent `pending` entry warning, so the tui profile does not ship it.

    # Host plane for the community extension ecosystem (dsh-ecosystem-spec
    # v0.15): admission, grants, effect ledger, plugin storage, message
    # observer. These load before the TUI so plugins can inject the seams.
    - id: plugin-host
      name: 'dsh-omp-tui/plugin-host'

    - id: plugin-storage
      name: 'dsh-omp-tui/plugin-storage'

    - id: message-observer
      name: 'dsh-omp-tui/message-observer'

    - id: effect-ledger
      name: 'dsh-omp-tui/effect-ledger'

    - id: tui
      name: 'dsh-omp-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId ?? ctx.tuiStartup.resumeSessionId
        showReasoning: true
        maxToolOutputLines: 6
        defaultReasoningEffort: max
        title: dsh

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
